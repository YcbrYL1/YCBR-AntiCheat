settings:
  alerts-prefix: "&8[&cYCBR&8] &7"
  notify-every-vl: 1
  tick-interval: 1
  player-snapshot-interval-ticks: 2
  entity-snapshot-interval-ticks: 4
  check-threads: 2
  max-ping-for-checks: 400
  data-sweep-minutes: 30
  violation-decay-seconds: 60
  vl-reset-window-ms: 60000
  debug-velocity: false
  debug-packets: false
  auth-enabled: true
  auth-session-hours: 24
  auth-premium-players: []
  strict-mode: false
  ycbrop-players: []
  using-item-timeout-ms: 1500
  dataset:
    enabled: false
  bot-verification:
    enabled: true
    max-accounts-per-ip: 5
    account-retention-days: 30
    kick-first-join: "&c请重新进入服务器以完成验证"
    kick-many-accounts: "&c你已经有大量账号进入服务器，请你先退出再进入"
  ddos:
    enabled: true
    max-logins-per-minute: 3
    max-hostname-length: 255
    max-username-length: 16
    max-encrypted-response-length: 256
    handshake-timeout-seconds: 30
    status-timeout-seconds: 10
    login-timeout-seconds: 40
    scan-interval-seconds: 5
    kick-rate-limit: "&c登录尝试过于频繁，请等待一分钟后再试"
    kick-invalid: "&c连接参数异常"
  improbable:
    enabled: true
    window-seconds: 15
    min-threshold: 12
    threshold-per-player: 3
    min-players: 3
    fuse-seconds: 60
  ban:
    hours: 1
    kick-message: "&c你已被 YCBR 反作弊封禁，剩余 %remaining%，到期时间：%time%（北京时间）"
    login-denied-message: "&c你已被 YCBR 反作弊封禁，剩余 %remaining%，到期时间：%time%（北京时间）"

checks:
  killaura:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for KillAura"
    aimstat-cross: true
    # 瞄准启发式子检测（AimStep/Gcd/ConstStep/AxisAsym/BigRot/Angle/Switch）软降级：
    # false = 兼容旧行为（aimstat 关闭时直判）；true = 仅当 aimstat 交叉信号命中且新鲜
    # 才 punish，否则只投 heur-* 信号不封禁（消除 aimstat 未就绪时的直判误杀）。
    # P1-3 默认 true：配合 aimstat.enabled=true，启发式只做信号、统计层交叉后才惩罚。
    heuristic-soft: true
    reach:
      enabled: true
      max-distance: 3.05
      ping-compensation: 0.002
      extrapolate-cap-ticks: 10
      vl-before-flag: 5
      exempt-entity-types: "SLIME,MAGMA_CUBE,GIANT,ENDER_DRAGON,WITHER,GUARDIAN"
    angle:
      enabled: true
      # 命中盒膨胀：正常 10cps 快速连点时准星会短暂偏移，0.35 偏严（实测误判）；
      # 0.5 仍能抓 KA 锁定（KA 准星必然大幅偏离目标）。若仍误判，可开 killaura.heuristic-soft
      hit-expand: 0.5
      ping-expand: 0.002
      turn-exempt-degrees: 25.0
      vl-before-flag: 6
    selfinteract:
      enabled: true
      vl-before-flag: 1
      hard-cancel: true
      hard-block-ms: 500
      # 子级踢人阈值：硬检测自击（KA 经典痕迹）快速清场；其它子项缺省继承 killaura 的 20
      kick-at-vl: 5
    autoblock:
      enabled: true
      # 【语义修正】挖掘持续超过该值(ms)后的攻击 = 挖矿中反击/左键挖右键打（1.8 合法）→ 豁免。
      # 只判"挖掘刚启动(<300ms)就攻击"的 AutoBlock 作弊指纹（攻击触发的挖掘模拟）。
      mine-exempt-ms: 300
      # 受击后豁免：挖矿被攻击→松手→digging 复位延迟期间不判
      hit-exempt-ms: 800
      # 连续次数：挖掘早期攻击需连续 3 次（高速连击）才 flag
      streak: 3
      # 攻击间隔 <150ms（>6.7cps）才算连续；正常攻击速度会断开 streak
      streak-gap-ms: 150
      vl-before-flag: 2
      # 只警示不封禁：高于 killaura 的 20 → 永不触发 KillAura 封禁（低置信子项）
      kick-at-vl: 25
    inventorycombo:
      enabled: true
      attack-window-ms: 100
      vl-before-flag: 1
    post:
      enabled: true
      tps-exempt: 15
      min-gap-ms: 40
      max-gap-ms: 100
      max-ping: 150
      vl-before-flag: 3
    switch:
      enabled: true
      ratio-reset: 40
      min-samples: 20
      min-ratio: 0.85
      window-ms: 5
      min-yaw-rate: 15
      vl-before-flag: 2
    throughwalls:
      enabled: true
      min-distance: 1.5
      ray-length: 5.0
      sample-step: 0.35
      max-rays: 32
      min-blocked-distance: 1.5
      max-target-speed: 0.6
      double-trigger-ms: 12000
      tps-exempt: 15
      vl-before-flag: 3
    modulo360:
      enabled: true
      min-streak: 2
      max-ping: 150
      vl-before-flag: 2
    # P1-1 硬检测：纯 LOOK 包（无位置）旋转与上一包完全相同。原版 1.8 仅在旋转
    # 变化时才发 LOOK 包 → 完全相同 = 旋转伪造（KA 固定视角/rotation spoofer）。
    # 豁免：载具（骑乘每 tick 无条件发 LOOK）、传送确认窗口、高 ping、
    # 攻击窗口外（放方块/使用物品时客户端会发重复 LOOK 包，无攻击无作弊意义）、
    # 放置后豁免（同上）。
    duplook:
      enabled: true
      teleport-exempt-ms: 500
      attack-window-ms: 3500
      place-exempt-ms: 500
      min-streak: 1
      vl-before-flag: 2
    # P1-2 硬判：攻击命中但攻击者视角射线在目标碰撞箱（多帧位置 + ping 膨胀）外。
    # 与 angle（软门控）互补：攻击时刻即时判定、无转向豁免。
    hitboxes:
      enabled: true
      expand: 0.1
      ping-expand: 0.002
      max-snapshot-age-ms: 500
      vl-before-flag: 4
    cps:
      enabled: true
      max-cps: 20
      window-ms: 1000
      required-consecutive-windows: 2
      max-ping: 200
      vl-before-flag: 6
    aimstep:
      enabled: true
      max-no-delta: 0.00001
      min-step-delta: 20.0
      vl-before-flag: 8
    gcd:
      enabled: true
      vl-before-flag: 6
    gcdgrid:
      enabled: false
      vl-before-flag: 6
    conststep:
      enabled: true
      vl-before-flag: 6
    axisasym:
      enabled: true
      var-max: 0.05
      var-min: 20
      vl-before-flag: 6
    interval:
      enabled: true
      max-cv: 0.1
      vl-before-flag: 5
    noswing:
      enabled: true
      window-ms: 400
      vl-before-flag: 3
    noswingsame:
      enabled: true
      vl-before-flag: 2
    multiinteract:
      enabled: true
      max-gap-ms: 100
      vl-before-flag: 2
      burst-cancel-ms: 400
    multitarget:
      enabled: false
      switch-gap-ms: 800
      vl-before-flag: 5
    bigrot:
      enabled: true
      min-turn-degrees: 60
      min-turns: 5
      window-ms: 800
      vl-before-flag: 3
  scaffold:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for Scaffold"
    invalid-place:
      enabled: true
      vl-before-flag: 2
    fabricated:
      enabled: true
      vl-before-flag: 2
    footclick:
      enabled: false
      vl-before-flag: 1
    fast-place:
      enabled: true
      max-cps: 22
      window-ms: 1000
      vl-before-flag: 6
    move-place:
      enabled: true
      max-speed: 0.55
      vl-before-flag: 5
    place-aim:
      enabled: true
      max-horizontal: 6.5
      max-vertical: 4.0
      ping-expand: 0.004
      vl-before-flag: 4
    rotation:
      enabled: true
      max-yaw-diff: 120.0
      consecutive-away: 8
      vl-before-flag: 6
    cadence:
      enabled: false
      batch-size: 10
      tolerance-ms: 10
      vl-before-flag: 4
    colinear:
      enabled: false
      vl-before-flag: 4
    grid45:
      enabled: false
      max-pitch-std: 0.15
      max-yaw-mod: 0.02
      vl-before-flag: 4
    duprot:
      enabled: false
      vl-before-flag: 4
  # @Deprecated 经验公式（P0-2）：已被 simulation 引擎取代，关闭避免双判叠加。
  # 若需临时兜底可改回 true，但同一帧两处 flag 会放大 VL。
  speed:
    enabled: false
    kick-at-vl: 25
    kick-message: "&cKicked for Speed"
    extreme:
      enabled: true
      vl-before-flag: 2
    min-overage: 0.02
    min-avg-overage: 0.06
    spike-grace: 0.25
    spike-grace-ticks: 3
    ground:
      enabled: true
      limit: 0.34
      landing-ticks: 5
      landing-bonus: 0.1
      speed-potion-multiplier: 0.05
      ice-multiplier: 1.6
      boxed-multiplier: 1.1
    air:
      enabled: true
      minimum: 0.11
      momentum: 0.42
      momentum-decay: 0.985
      burst-potion-factor: 0.2
    vl-before-flag: 8
  velocity:
    enabled: true
    kick-at-vl: 15
    kick-message: "&cKicked for Velocity"
    # P2-4 冗余击退去重：Mojang 爆炸/连击场景同 tick 连发多个 ENTITY_VELOCITY。
    # 同窗口内向量完全相同的重复包直接忽略（客户端 motion 是 set 语义）；
    # 同窗口不同向量的后续包按差值注入 shadow（模拟 set 覆盖）。
    dedup-window-ms: 50
    dedup-vector-eps: 0.01
    arrival-window-ticks: 2
    horizontal:
      enabled: true
      expected-min: 0.3
      ratio-air: 0.25
      ratio-ground: 0.15
      ratio-partial: 0.5
      expected-min-partial: 0.6
      partial-streak: 3
      direction-dot: -0.25
      reversed-streak: 3
      ratio-precise: 0.995
      precise-band-min: 0.97
      precise-band-max: 1.2
      precise-expected-min: 0.3
      precise-pre-speed: 0.06
      precise-streak: 2
      # 中等削减带（补检测空洞）：保留 80%~97% 的击退削减（Grim 能抓的 90% 场景）
      mid-reduce-min: 0.8
      mid-reduce-streak: 3
      vl-before-flag: 2
    jumpreset:
      enabled: true
      window-ms: 40
      streak: 3
      vl-before-flag: 4
    sprintreset:
      enabled: true
      min-lead-ms: 60
      max-lead-ms: 150
      streak: 3
      vl-before-flag: 4
    vertical:
      enabled: true
      minimum-percentage: 45.0
      expected-min: 0.25
      vl-before-flag: 4
    ledger:
      enabled: false
      window-ticks: 12
      streak: 2
      vl-before-flag: 3
  # 预测引擎（P0-1 默认开启）：单/多 tick AABB 碰撞重演，网格缺失自动回退墙距路径。
  # 开启后 speed/fly 已关闭（@Deprecated 启发式）；nofall 保留——其 onGround 谎报
  # 与摔落伤害检测面不被引擎覆盖。
  simulation:
    enabled: true
    # 搭路豁免：最近放置 + 正在移动（边走边放）或短窗口内 ≥N 次连续放置（快速搭路）
    # → sim-speed/sim-fly 完全豁免。搭路玩家在刚放下的方块上走/跳，水平碰撞微调 +
    # 体素网格异步采集不匹配 + 垂直位移大，单次放置豁免（限小位移）不适用。
    # 搭路是 1.8 合法玩法。bridge-active-window-ms：搭完停止放置该时间后豁免自动
    # 失效，防永久豁免掩盖作弊。bridge-min-move：慢速搭路（边走边放）兜底阈值。
    bridge-window-ms: 150
    bridge-min-placements: 2
    bridge-active-window-ms: 500
    bridge-min-move: 0.05
    grid-max-age-ms: 250
    sim-speed:
      enabled: true
      collision-replay: true
      horizontal-tolerance: 0.01
      liquid-tolerance-multiplier: 2.0
      vl-before-flag: 8
      direction-match:
        enabled: false
        max-angle-deg: 30
      strict:
        horizontal-tolerance: 0.005
    sim-fly:
      enabled: true
      vertical-tolerance: 0.02
      vl-before-flag: 10
      # 放置方块豁免：1.8 客户端放置方块会产生微小垂直位移（方块与玩家碰撞微调，
      # 如放脚下被顶起 ~0.08），引擎无此模型 → 放置后短暂豁免（限微小位移防掩盖飞行）。
      place-exempt-ms: 500
      place-max-dy: 0.2
      strict:
        vertical-tolerance: 0.01
  # P2-1 移动穿墙（对齐 Grim Phase）：玩家 AABB 与实心方块盒重叠 = 客户端绕过
  # 碰撞解析（NoClip/Phase/卡墙）。网格缺失/传送/挖掘/活塞邻域全豁免，
  # 穿透深度 + 连续 streak + VL 三重缓冲防误判。
  phase:
    enabled: true
    kick-at-vl: 15
    kick-message: "&cKicked for Phase"
    min-penetration: 0.05
    streak: 2
    teleport-exempt-ms: 1000
    dig-exempt-ms: 500
    piston-expand: 1
    vl-before-flag: 3
  # P1-3 与 heuristic-soft 配套开启：作为启发式子项的交叉验证信号源。
  # 统计层（熵/峰度/IQR/KS）误判低，vl-before-flag 6 + kick 20 双重缓冲。
  aimstat:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for AimStat"
    entropy-max: 1.5
    iqr-min: 0.0005
    ks-min-uniform: 0.15
    jiff-pattern-len: 3
    jiff-max: 2
    zscore-threshold: 4.0
    kurtosis-max: -0.5
    signal-fresh-ms: 10000
    vl-before-flag: 6
    ml-enabled: false
    ml-threshold: 0.9
    strict:
      entropy-max: 1.0
      iqr-min: 0.001
      ks-min-uniform: 0.2
      zscore-threshold: 3.5
  improbable:
    enabled: false
    kick-at-vl: 15
    kick-message: "&cKicked for Improbable"
    short-ticks: 20
    short-threshold: 6
    long-ticks: 200
    long-threshold: 30
    min-categories: 2
    vl-before-flag: 3
  # @Deprecated 经验公式（P0-2）：sim-fly 已覆盖上升/悬浮检测，关闭避免双判。
  fly:
    enabled: false
    kick-at-vl: 20
    kick-message: "&cKicked for Fly"
    rise:
      enabled: true
      max-vertical: 1.25
      jump-tolerance: 0.05
      full-tolerance: 0.02
      vl-before-flag: 5
    level:
      enabled: true
      max-hover-ticks: 8
      vl-before-flag: 6
  criticals:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for Criticals"
    air:
      enabled: true
      jump-tolerance: 0.05
      vl-before-flag: 5
  timer:
    enabled: true
    kick-at-vl: 30
    kick-message: "&cKicked for Timer"
    min-tps: 15
    window-size: 60
    min-avg: 0.95
    short-window-size: 25
    short-min-avg: 0.97
    burst-window-size: 10
    burst-min-avg: 0.85
    burst-window-ms: 500
    burst-vl-before-flag: 3
    vl-before-flag: 5
  nofall:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for NoFall"
    window-ticks: 20
    window-min-claims: 8
    fall-damage-vl-before-flag: 3
    vl-before-flag: 5
  badpacket:
    enabled: true
    kick-at-vl: 20
    vehicle-grace-ms: 2000
  noslow:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for NoSlow"
    tolerance: 0.045
    streak: 2
    vl-before-flag: 4
  autotool:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for AutoTool"
    cooldown-ms: 150000
    vl-before-flag: 3
  fastthrow:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for FastThrow"
    count: 3
    cooldown-ms: 5000
    max-ping: 300
    vl-before-flag: 3
  instantbow:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for InstantBow"
    bow-force-min: 0.15
    tolerance-ms: 130
    cooldown-ms: 5000
    vl-before-flag: 2
  fastclick:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for FastClick"
    max-ping: 200
    burst-window-ms: 250
    burst-count: 6
    cooldown-ms: 5000
    vl-before-flag: 2
    mechanical:
      kurtosis-max: -1.5
      # 高速前置：平均点击间隔超过该值（ms）不算点击宏（排除挖矿/慢速恒定节奏误判）
      max-mean-interval-ms: 120
      vl-before-flag: 3
  reach:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for Reach"
    max-reach: 3.1
    leniency: 0.03
    cancel-impossible: true
    multi-frame:
      enabled: true
      window-ticks: 2
      expand: 0.05
    reach-mod:
      enabled: false
      edge-streak-required: 8
      shrink-step: 0.05
      max-shrink: 0.5
      edge-band: 0.15
    vl-before-flag: 2
  wrongturn:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for WrongTurn"
    vl-before-flag: 1
  sprint:
    enabled: true
    kick-at-vl: 20
    kick-message: "&cKicked for Sprint"
    max-flip-gap-ms: 40
    flips-to-flag: 3
    vl-before-flag: 2
blink:
      enabled: true
      kick-at-vl: 20
      kick-message: "&cKicked for Blink"
      min-tps: 15
      max-silence-ms: 2000
      pong-live-ms: 1500
      cooldown-ms: 5000
      vl-before-flag: 2
      replay-burst:
        enabled: false
        window: 40
        min-silence-ms: 1000
        min-burst-packets: 8
        max-interval-ms: 25
        vl-before-flag: 6
      # P2-3 Blink 包序扩展：交互包（攻击/放置/挖掘）持续到达但移动包断流 =
      # 只囤移动包的选择性 Blink。原版 1.8 有 20-tick 位置心跳（静止也每秒发
      # POSITION），min-silence 1500ms > 心跳周期 1000ms → 正常客户端永不命中。
      interact-silence:
        enabled: true
        min-silence-ms: 1500
        interact-live-ms: 300
        vl-before-flag: 3